apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # $2 captures everything after /api — so /api/users → /users on api-gateway
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Capture group: (/|$) matches slash-or-end; (.*) captures the rest as $2
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway       # Must match api-gateway Service metadata.name exactly
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service  # Must match frontend-service Service metadata.name exactly
                port:
                  number: 3000
