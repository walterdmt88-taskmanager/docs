apiVersion: v1
kind: Service
metadata:
  name: frontend-service  # K8s DNS: frontend-service:3000 — Ingress backend for /
  namespace: default
spec:
  selector:
    app: frontend-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: 905418181527.dkr.ecr.eu-central-1.amazonaws.com/taskmanager-frontend:v1
          ports:
            - containerPort: 3000
          # No env vars — React SPA compiled with VITE_API_BASE_URL baked in at build time
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
